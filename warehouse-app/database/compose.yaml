services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stocker
      POSTGRES_USER: stocker
      POSTGRES_PASSWORD: stocker
    ports:
      - "5432:5432"
    volumes:
      - stocker-data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  stocker-data:
